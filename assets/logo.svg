<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="glowWide" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="glowTight" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="round">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="#0a0a0a"/>

    <g transform="translate(256 256) scale(1.9) translate(-340 -120.5)">
      <circle cx="340" cy="108" r="72" fill="#f4f6f9" opacity="0.3" filter="url(#glowWide)"/>
      <circle cx="340" cy="108" r="70" fill="#f4f6f9" opacity="0.9" filter="url(#glowTight)"/>
      <circle cx="340" cy="108" r="66" fill="#f4f6f9"/>

      <g fill="#f4f6f9" stroke="#f4f6f9" stroke-width="5.3">
        <rect x="240" y="142" width="200" height="54" rx="27"/>
        <circle cx="285" cy="148" r="30"/>
        <circle cx="345" cy="132" r="44"/>
        <circle cx="400" cy="150" r="28"/>
      </g>
      <g fill="#131417">
        <rect x="240" y="142" width="200" height="54" rx="27"/>
        <circle cx="285" cy="148" r="30"/>
        <circle cx="345" cy="132" r="44"/>
        <circle cx="400" cy="150" r="28"/>
      </g>
    </g>
  </g>
</svg>